<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 326" role="img" aria-labelledby="title description">
  <title id="title">Mudassir Ijaz, Python backend developer</title>
  <desc id="description">A midnight blue profile banner with a glowing circuit connecting API, database and UI blocks.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#0b1222"/>
      <stop offset="1" stop-color="#151632"/>
    </linearGradient>
    <linearGradient id="signal" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop stop-color="#64f4d0"/>
      <stop offset="1" stop-color="#b9a7ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 H 0 V 24" fill="none" stroke="#a8b7f0" stroke-opacity=".16"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="326" rx="25"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="326" fill="url(#background)"/>
    <path d="M620 0H1000V326H506Z" fill="url(#grid)"/>
    <path d="M620 0 506 326" stroke="#9c97f1" stroke-opacity=".24"/>
    <path d="M0 322H1000V326H0Z" fill="url(#signal)"/>
    <g font-family="system-ui,Segoe UI,sans-serif">
      <text x="53" y="73" fill="#64f4d0" font-size="20" font-weight="700" letter-spacing="3">BACKEND DEVELOPMENT</text>
      <text x="49" y="150" fill="#f4f6ff" font-size="76" font-weight="750" letter-spacing="-3">Mudassir Ijaz</text>
      <text x="53" y="202" fill="#ced5f1" font-size="29">Python · FastAPI · PostgreSQL</text>
      <rect x="53" y="243" width="207" height="40" rx="20" fill="#182940" stroke="#46616f"/>
      <circle cx="73" cy="263" r="4.5" fill="#64f4d0"/>
      <text x="88" y="270" fill="#e7f6f4" font-size="18" font-weight="650">Based in Pakistan</text>
    </g>
    <g font-family="ui-monospace,Consolas,monospace">
      <path d="M676 97H784V164H846M846 164V237H749" fill="none" stroke="#64f4d0" stroke-width="2.5"/>
      <path d="M687 238H635V170H710" fill="none" stroke="#a694ff" stroke-width="1.6" stroke-dasharray="5 5"/>
      <circle cx="784" cy="164" r="4.5" fill="#64f4d0"/>
      <circle cx="635" cy="170" r="4.5" fill="#a694ff"/>
      <rect x="638" y="72" width="103" height="50" rx="10" fill="#142a37" stroke="#64f4d0"/>
      <rect x="800" y="139" width="103" height="50" rx="10" fill="#262348" stroke="#b9a7ff"/>
      <rect x="687" y="213" width="103" height="50" rx="10" fill="#142a37" stroke="#64f4d0"/>
      <text x="690" y="104" text-anchor="middle" fill="#b4ffe9" font-size="20" font-weight="700">API</text>
      <text x="851" y="171" text-anchor="middle" fill="#e1d9ff" font-size="20" font-weight="700">DATA</text>
      <text x="739" y="245" text-anchor="middle" fill="#b4ffe9" font-size="20" font-weight="700">UI</text>
    </g>
  </g>
</svg>
